project: shad
ports: [PORT]
native:
  docs:
    cmd: pnpm dev
    env: "*"
tasks:
  scripts-check:
    cmds:
      - pnpm exec eslint tests/*.test.ts
      - pnpm exec tsc --noEmit -p tsconfig.tests.json
  test-ts:
    cmds:
      - pnpm exec tsx --tsconfig tsconfig.tests.json --test tests/*.test.ts
  context-build:
    cmds:
      - pnpm dlx @mp-lb/mdcompile context/index.md --optional --silent | fm compile --stdin -o AGENTS.md
      - pnpm dlx @mp-lb/mdcompile context/index.md --optional --silent | fm compile --stdin -o CLAUDE.md
  worktree-setup:
    cmds:
      - pnpm install --frozen-lockfile
  test:
    cmds:
      - node --import ./tests/tsx-loader.mjs --test tests/*.test.mjs
  registry-build:
    cmds:
      - pnpm registry:build
  typecheck:
    cmds:
      - pnpm exec tsc --noEmit -p apps/docs/tsconfig.json
      - pnpm --filter playground exec tsc -b
  lint:
    cmds:
      - NODE_OPTIONS=--max-old-space-size=4096 pnpm --filter playground exec eslint .
  lint-components:
    cmds:
      - NODE_OPTIONS=--max-old-space-size=4096 node apps/playground/node_modules/eslint/bin/eslint.js --config apps/playground/eslint.config.js registry/json-viewer/json-viewer.tsx registry/structured-log-viewer/structured-log-viewer.tsx
  build:
    cmds:
      - pnpm build
  playground-build:
    cmds:
      - pnpm --filter playground build
