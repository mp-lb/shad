version: 1
project: shad
environment: mp-lb
repository: mp-lb/shad
vercel:
  dnsZone: mp-lb.dev
  sites:
    docs:
      domain: shad.mp-lb.dev
      mode: new
      projectName: arcnet.shad.docs
      root: .
variables:
  store: mp-lb/mp-lb
  paths:
    - /admin/standard-variables.json
secrets:
  sources:
    - key: ARCNET_STANDARD_SECRETS_KEY
      store: mp-lb/mp-lb
      path: /admin/standard-secrets.json.enc
  consumers:
    deploy:
      VERCEL_TOKEN: VERCEL_API_TOKEN
      CLOUDFLARE_API_TOKEN: CLOUDFLARE_API_TOKEN
