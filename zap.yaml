project: shad
ports: [PORT]
native:
  docs:
    cmd: pnpm dev
    env: "*"
tasks:
  scripts-check:
    cmds:
      - pnpm ci:lint-tests
      - pnpm ci:typecheck-tests
  context-build:
    cmds:
      - |
        set -eu
        context_temp=$(mktemp -d)
        trap 'rm -rf "$context_temp"' EXIT
        mdcompile context/index.md --silent -o "$context_temp/local.md"
        fm compile --stdin -o "$context_temp/shared.md" < "$context_temp/local.md"
        cp "$context_temp/shared.md" AGENTS.md
        cp "$context_temp/shared.md" CLAUDE.md
  worktree-setup:
    cmds:
      - pnpm install --frozen-lockfile
  test:
    cmds:
      - pnpm ci:test
  registry-build:
    cmds:
      - pnpm registry:build
  typecheck:
    cmds:
      - pnpm ci:typecheck-tests
      - pnpm exec tsc --noEmit -p apps/docs/tsconfig.json
      - pnpm --filter playground exec tsc -b
  lint:
    cmds:
      - pnpm ci:lint-tests
      - NODE_OPTIONS=--max-old-space-size=4096 pnpm --filter playground exec eslint .
  lint-components:
    cmds:
      - NODE_OPTIONS=--max-old-space-size=4096 node apps/playground/node_modules/eslint/bin/eslint.js --config apps/playground/eslint.config.js registry/json-viewer/json-viewer.tsx registry/structured-log-viewer/structured-log-viewer.tsx
  build:
    cmds:
      - pnpm build
  playground-build:
    cmds:
      - pnpm --filter playground build
